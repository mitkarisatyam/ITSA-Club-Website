er\u003c/span\u003e.\",\"description\":\"I work at the intersection of design and code. 3D scenes, scroll-driven narratives, and motion-rich interfaces built with care for every detail. Not just functional — crafted.\",\"cta1\":\"Start a project\",\"cta2\":\"View work\"},\"resume\":{\"title\":\"\u003cspan class='flex mobile-landscape:w-fit mobile-landscape:ml-auto'\u003eShaping the Future\u003c/span\u003e\u003cspan class='flex flex-col'\u003e\u003cspan\u003eThrough Design, Technology,\u003c/span\u003e\u003cspan\u003eand Bold Ideas.\u003c/span\u003e\u003c/span\u003e\",\"description\":\"Over 8 years building for the web — across startups, agencies, and brands. From simple landing pages to immersive experiences, always with the same attention to detail.\",\"cta\":\"Learn more\",\"ctaSuffix\":\" about ITSA — VIT Pune\"},\"selectedWorks\":{\"title\":\"Featured work\",\"description\":\"Creating experiences that people love to use because we start from the starting point of those people.\",\"copy\":\"I design and build digital experiences that blend creativity, technology, and strategy — helping ideas become engaging products, platforms, and interactive experiences.\",\"cta\":\"View all works\"},\"services\":{\"title\":\"From Ideation to Launch, I've Got You Covered.\",\"description\":\"I design and build web experiences that go beyond the expected — 3D scenes, scroll-driven narratives, and motion-rich interfaces that make people stop and pay attention.\",\"immersiveWebExperiences\":{\"title\":\"Immersive Web Experiences\",\"3DInteractiveExperiences\":{\"title\":\"3D Interactive Experiences\",\"copy\":\"Your product in 3D — interactive, real-time, web-native.\",\"description\":\"Real-time 3D scenes built for the web. Product visualizers, interactive environments, and narrative experiences that run in the browser without sacrificing performance.\"},\"webGLShaderEffects\":{\"title\":\"WebGL \u0026 Shader Effects\",\"copy\":\"Visual effects that feel impossible — and run in the browser.\",\"description\":\"Custom GLSL shaders for transitions, distortions, particle systems, and post-processing effects. The kind of visual layer that separates a good site from one people send to each other.\"},\"scrollStorytelling\":{\"title\":\"Scroll Storytelling\",\"copy\":\"A story that unfolds as you scroll.\",\"description\":\"Scroll-driven narratives where every pixel of movement is intentional. Sequential animations, pinned sections, parallax, and 3D integration — designed to guide attention and keep people engaged.\"}},\"premiumWebsites\":{\"title\":\"Premium Websites\",\"creativeMarketingSites\":{\"title\":\"Creative Marketing Sites\",\"copy\":\"A site that sells before anyone reads a word.\",\"description\":\"Launch sites, product pages, and campaign experiences where the visual impact is the message. Designed and built from scratch, or developed from your existing designs — with motion and 3D when the project calls for it.\"},\"portfolioBrandSites\":{\"title\":\"Portfolio \u0026 Brand Sites\",\"copy\":\"Your brand, crafted pixel by pixel.\",\"description\":\"Premium sites for studios, agencies, and creative professionals who need their online presence to match the quality of their work. Identity-driven design, fluid animations, and performance built in.\"},\"motionRichInterfaces\":{\"title\":\"Motion-rich Interfaces\",\"copy\":\"Interfaces that feel alive.\",\"description\":\"UIs where motion is part of the design language — not an afterthought. Page transitions, micro-interactions, animated components, and gesture-driven experiences that make digital products feel tactile.\"}},\"designDevelopment\":{\"title\":\"Design + Development\",\"fullDesignBuild\":{\"title\":\"Full Design \u0026 Build\",\"copy\":\"One person. Full ownership. From concept to launch.\",\"description\":\"For clients who want a single creative responsible for the entire result — not just a part of it. I handle concept, visual design, interaction design, and development. You get a cohesive experience, without the back-and-forth of managing separate teams.\"},\"creativeDevPartnership\":{\"title\":\"Creative Dev Partnership\",\"copy\":\"Your creative vision, technically executed.\",\"description\":\"I partner with agencies and studios as a technical creative collaborator. You bring the concept and direction — I handle the implementation: 3D, WebGL, animation, and the parts of the project that need both engineering precision and aesthetic judgment.\"},\"visualDesign\":{\"title\":\"Visual Design\",\"copy\":\"The aesthetic layer, without the development overhead.\",\"description\":\"Brand-aligned visual design for web — landing pages, marketing sites, and digital products. Figma-delivered, production-ready, and designed with implementation in mind. Ideal for teams with their own developers who need a creative with technical awareness.\"}}},\"process\":{\"title\":\"A process built around clarity and craft.\",\"description\":\"No surprises, no handoff chaos. Just a clear path from the first conversation to a product that works.\",\"cta\":\"Let's build something\",\"step1\":{\"title\":\"Discovery\",\"description\":\"Understanding your goals, audience, and constraints before touching a single pixel.\"},\"step2\":{\"title\":\"Concept \u0026 Design\",\"description\":\"Visual direction, interaction design, and prototyping. You see it before I build it.\"},\"step3\":{\"title\":\"Development\",\"description\":\"Pixel-perfect implementation with performance and attention to detail built in.\"},\"step4\":{\"title\":\"Launch \u0026 Beyond\",\"description\":\"Deployment, testing, and support. I don't disappear after the handoff.\"}}},\"about\":{\"hero\":{\"title\":\"Building the future of digital experiences through design, technology, and human imagination\"},\"about\":{\"title\":\"About\",\"p1\":\"I'm Ricardo — a design engineer from Buenos Aires who got into tech through business, fell in love with the web, and never stopped pushing what it can do. I care about craft, precision, and building things that feel different.\",\"p2\":\"I specialize in the intersection of design and code — building 3D experiences, scroll-driven stories, and motion-rich interfaces. I think in systems but obsess over details. The kind of work that takes a week longer because it deserves it.\",\"p3\":\"Beyond creative development, I have roots in product design, UX, and full-stack engineering — Node.js, GraphQL, Supabase, workflow automation. Before tech, I spent five years in business administration: planning, strategy, operations. That context shapes how I work. I understand what a project needs to achieve, not just how it should look or function.\"},\"currently\":{\"title\":\"Curently\",\"description\":\"Outside of client work, I explore 3D art and environments in Blender, game mechanics in Unreal Engine, and the boundaries between creative tools — where art, technology, and product thinking overlap. I'm currently studying Innovation \u0026 Startups Management at Universidad de Palermo. I'm drawn to generative systems, emergent design, and building things just to understand how they work. I learn by building. Always have.\"},\"toolsAndTechnologies\":{\"title\":\"Tools and Technologies\"},\"expertise\":{\"title\":\"Expertise\",\"description\":\"I have worked in the technology industry since 2017, performing different roles, such as Software Engineer and UX/UI Product Designer. Before entering the technology field, I worked for approximately 5 years in business administration, focused on business planning, strategy, operations and leadership.\"},\"companiesIveWorkedWith\":{\"title\":\"Companies I've worked with\",\"cta\":\"know more\"},\"approach\":{\"title\":\"Approach\",\"description\":\"I don't separate design from engineering — they're the same conversation. I start with the problem, build with intention, and don't stop until the details are right. I ask questions before I open Figma. I push back when something doesn't serve the goal
